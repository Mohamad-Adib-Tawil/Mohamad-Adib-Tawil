    <text y="53" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="31" font-weight="700">Quran Ahmed Karasi</text>
    <text y="84" fill="#8D9BAE" font-family="Inter, sans-serif" font-size="15">Offline reader · Production on iOS + Android</text>

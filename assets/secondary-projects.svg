<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secondaryTitle secondaryDescription">
  <title id="secondaryTitle">More production work</title>
  <desc id="secondaryDescription">Editorial cards for Quran Ahmed Karasi and Book Code applications.</desc>
  <defs>
    <linearGradient id="secondaryBg" x1="0" y1="0" x2="1200" y2="390" gradientUnits="userSpaceOnUse"><stop stop-color="#0E1727"/><stop offset=".5" stop-color="#070A10"/><stop offset="1" stop-color="#11110A"/></linearGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientTransform="translate(1020 90) rotate(140) scale(340 280)" gradientUnits="userSpaceOnUse"><stop stop-color="#FBBF24" stop-opacity=".13"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
    <style>.wave{animation:wave 3.4s ease-in-out infinite;transform-origin:center}.book{animation:book 5s ease-in-out infinite;transform-origin:center}@keyframes wave{0%,100%{transform:scaleY(.65);opacity:.5}50%{transform:scaleY(1);opacity:1}}@keyframes book{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>

    </g>
    <text x="112" y="163" fill="#D8E0EA" font-family="Inter, sans-serif" font-size="16">Explicit 8-phase audio state machine</text><text x="112" y="190" fill="#8D9BAE" font-family="Inter, sans-serif" font-size="13">focus · repeat · sleep timer · secure URLs</text>
    <rect y="232" width="112" height="32" rx="16" fill="#67E8F9" fill-opacity=".08" stroke="#67E8F9" stroke-opacity=".3"/><text x="56" y="253" text-anchor="middle" fill="#A5F3FC" font-family="ui-monospace, monospace" font-size="11">JUST_AUDIO</text>
    <rect x="124" y="232" width="92" height="32" rx="16" fill="#67E8F9" fill-opacity=".08" stroke="#67E8F9" stroke-opacity=".3"/><text x="170" y="253" text-anchor="middle" fill="#A5F3FC" font-family="ui-monospace, monospace" font-size="11">CUBIT</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="journeyTitle journeyDescription">
  <title id="journeyTitle">Mohamad Adib Tawil's GitHub journey since 2021</title>
  <desc id="journeyDescription">A timeline showing a GitHub journey beginning in 2021, Flutter production work since 2022, and the current profile continuing that journey since 2025.</desc>
  <defs>
    <linearGradient id="journeyBg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101827"/>
      <stop offset="0.52" stop-color="#070A10"/>
      <stop offset="1" stop-color="#061A1D"/>
    </linearGradient>
    <linearGradient id="journeyLine" x1="84" y1="220" x2="1116" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="0.48" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="journeyGlow" cx="0" cy="0" r="1" gradientTransform="translate(1040 32) rotate(130) scale(350 270)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="journeyGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#E2E8F0" stroke-opacity="0.03"/>
    </pattern>
    <filter id="journeyNodeGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .journey-path { stroke-dasharray: 10 12; animation: journeyFlow 8s linear infinite; }
      .journey-pulse { animation: journeyPulse 2.8s ease-in-out infinite; transform-origin: center; }
      .delay-one { animation-delay: .7s; }
      .delay-two { animation-delay: 1.4s; }
      .delay-three { animation-delay: 2.1s; }
      @keyframes journeyFlow { to { stroke-dashoffset: -176; } }
      @keyframes journeyPulse { 0%,100% { opacity: .5; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.16); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#journeyBg)"/>
  <rect width="1200" height="330" rx="28" fill="url(#journeyGlow)"/>
  <rect width="1200" height="330" rx="28" fill="url(#journeyGrid)"/>
  <rect x="1" y="1" width="1198" height="328" rx="27" stroke="#94A3B8" stroke-opacity="0.18" stroke-width="2"/>

  <text x="64" y="62" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2.2">GITHUB JOURNEY / CONTINUITY</text>
  <text x="64" y="111" fill="#F8FAFC" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="750">Building in public since 2021.</text>
  <text x="66" y="145" fill="#94A3B8" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15">The current profile continues an engineering journey that began on an earlier account.</text>

  <path class="journey-path" d="M84 220H1116" stroke="url(#journeyLine)" stroke-opacity="0.62" stroke-width="2"/>

  <g transform="translate(112 220)">
    <circle class="journey-pulse" r="12" fill="#818CF8" fill-opacity="0.18" filter="url(#journeyNodeGlow)"/>
    <circle r="6" fill="#A5B4FC"/>
    <text x="-28" y="-30" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="18" font-weight="700">2021</text>
    <text x="-28" y="35" fill="#7F8DA1" font-family="ui-monospace, monospace" font-size="11">JOURNEY STARTED</text>
  </g>
  <g transform="translate(420 220)">
    <circle class="journey-pulse delay-one" r="12" fill="#67E8F9" fill-opacity="0.18" filter="url(#journeyNodeGlow)"/>
    <circle r="6" fill="#67E8F9"/>
    <text x="-28" y="-30" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="18" font-weight="700">2022</text>
    <text x="-28" y="35" fill="#7F8DA1" font-family="ui-monospace, monospace" font-size="11">FLUTTER IN PRODUCTION</text>
  </g>
  <g transform="translate(738 220)">
    <circle class="journey-pulse delay-two" r="12" fill="#2DD4BF" fill-opacity="0.18" filter="url(#journeyNodeGlow)"/>
    <circle r="6" fill="#5EEAD4"/>
    <text x="-28" y="-30" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="18" font-weight="700">2025</text>
    <text x="-28" y="35" fill="#7F8DA1" font-family="ui-monospace, monospace" font-size="11">CURRENT PROFILE</text>
  </g>
  <g transform="translate(1054 220)">
    <circle class="journey-pulse delay-three" r="12" fill="#34D399" fill-opacity="0.18" filter="url(#journeyNodeGlow)"/>
    <circle r="6" fill="#6EE7B7"/>
    <text x="-28" y="-30" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="18" font-weight="700">NOW</text>
    <text x="-28" y="35" fill="#7F8DA1" font-family="ui-monospace, monospace" font-size="11">SHIPPING &amp; SCALING</text>
  </g>

  <text x="64" y="304" fill="#627186" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.35">CURRENT ACCOUNT ESTABLISHED IN 2025 · ENGINEERING HISTORY SINCE 2021</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="230" viewBox="0 0 1200 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="footerTitle footerDescription">
  <title id="footerTitle">Build something that ships</title><desc id="footerDescription">Premium dark contact banner for mobile product collaboration.</desc>
  <defs><linearGradient id="footerBg" x1="0" y1="0" x2="1200" y2="230"><stop stop-color="#101827"/><stop offset=".52" stop-color="#070A10"/><stop offset="1" stop-color="#062126"/></linearGradient><linearGradient id="footerAccent" x1="70" y1="0" x2="1120" y2="0"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#34D399"/></linearGradient><style>.cta{animation:cta 4s ease-in-out infinite}.line{stroke-dasharray:90 900;animation:line 7s linear infinite}@keyframes cta{0%,100%{opacity:.7}50%{opacity:1}}@keyframes line{to{stroke-dashoffset:-990}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
  <rect width="1200" height="230" rx="28" fill="url(#footerBg)"/><rect x="1" y="1" width="1198" height="228" rx="27" stroke="#94A3B8" stroke-opacity=".18" stroke-width="2"/><path class="line" d="M70 28H1130" stroke="url(#footerAccent)" stroke-width="2"/>

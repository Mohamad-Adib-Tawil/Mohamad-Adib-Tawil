<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDescription">
  <title id="heroTitle">Mohamad Adib Tawil — Flutter Developer and Mobile Application Engineer</title>
  <desc id="heroDescription">Animated premium dark editorial hero showing production Flutter engineering, real-time systems, and offline-first architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="46" y1="20" x2="1152" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.5" stop-color="#070A10"/>
      <stop offset="1" stop-color="#061316"/>
    </linearGradient>
    <linearGradient id="accent" x1="92" y1="78" x2="1060" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="glass" x1="710" y1="68" x2="1080" y2="462" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(1032 82) rotate(127) scale(430 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#E2E8F0" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .dash { stroke-dasharray: 7 10; animation: dash 8s linear infinite; }
      .float-a { animation: floatA 5.5s ease-in-out infinite; transform-origin: center; }
      .float-b { animation: floatB 6.5s ease-in-out infinite; transform-origin: center; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .blink { animation: blink 1.1s steps(2, jump-none) infinite; }
      .shimmer { animation: shimmer 6s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -136; } }
      @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
      @keyframes pulse { 0%,100% { opacity: .45; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes shimmer { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="30" fill="url(#cyanGlow)"/>
  <rect width="1200" height="520" rx="30" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="518" rx="29" stroke="#94A3B8" stroke-opacity="0.2" stroke-width="2"/>

  <g transform="translate(72 66)">
    <rect width="214" height="32" rx="16" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.35"/>
    <circle class="pulse" cx="18" cy="16" r="5" fill="#34D399"/>
    <text x="32" y="21" fill="#A7F3D0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.3">AVAILABLE FOR REMOTE</text>
  </g>

  <text x="72" y="159" fill="#F8FAFC" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="57" font-weight="760" letter-spacing="-1.8">Mohamad Adib Tawil</text>
  <text x="75" y="203" fill="url(#accent)" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="650">Flutter Developer · Mobile Application Engineer</text>
  <text x="75" y="253" fill="#CBD5E1" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17">I architect mobile products that stay fast, resilient, and maintainable</text>
  <text x="75" y="280" fill="#CBD5E1" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17">from the first commit to the store release.<tspan class="blink" fill="#67E8F9">_</tspan></text>

  <g transform="translate(72 332)">
    <g>
      <text y="27" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="29" font-weight="750">4</text>
      <text x="24" y="27" fill="#67E8F9" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">YEARS</text>
      <text y="51" fill="#78879B" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.2">PRODUCTION EXPERIENCE</text>
    </g>
    <path d="M198 2V57" stroke="#94A3B8" stroke-opacity="0.2"/>
    <g transform="translate(228)">
      <text y="27" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="29" font-weight="750">5+</text>
      <text x="38" y="27" fill="#67E8F9" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">APPS</text>
      <text y="51" fill="#78879B" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.2">SHIPPED END TO END</text>
    </g>
    <path d="M419 2V57" stroke="#94A3B8" stroke-opacity="0.2"/>
    <g transform="translate(450)">
      <text y="27" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="29" font-weight="750">5K+</text>
      <text y="51" fill="#78879B" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.2">LKLK DOWNLOADS</text>
    </g>
  </g>

  <g transform="translate(712 54)">
    <rect width="414" height="408" rx="28" fill="url(#glass)" stroke="#94A3B8" stroke-opacity="0.18"/>
    <rect x="26" y="24" width="362" height="42" rx="12" fill="#020617" fill-opacity="0.45" stroke="#94A3B8" stroke-opacity="0.14"/>
    <circle cx="48" cy="45" r="5" fill="#FB7185"/>
    <circle cx="66" cy="45" r="5" fill="#FBBF24"/>
    <circle cx="84" cy="45" r="5" fill="#34D399"/>
    <text x="108" y="50" fill="#758398" font-family="ui-monospace, monospace" font-size="11">mobile_system.architecture</text>

    <path class="dash" d="M206 126C129 126 113 179 113 218C113 271 148 301 206 301" stroke="#67E8F9" stroke-opacity="0.42" stroke-width="1.5"/>
    <path class="dash" d="M206 126C283 126 300 179 300 218C300 271 264 301 206 301" stroke="#34D399" stroke-opacity="0.42" stroke-width="1.5"/>
    <path class="dash" d="M206 126V301" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1.5"/>

    <g class="float-a">
      <rect x="148" y="94" width="116" height="62" rx="16" fill="#0B1220" stroke="#67E8F9" stroke-opacity="0.5"/>
      <text x="206" y="120" text-anchor="middle" fill="#E2E8F0" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">PRESENTATION</text>
      <text x="206" y="139" text-anchor="middle" fill="#718096" font-family="ui-monospace, monospace" font-size="10">BLoC · Cubit</text>
    </g>
    <g class="float-b">
      <rect x="55" y="190" width="116" height="62" rx="16" fill="#0B1220" stroke="#C084FC" stroke-opacity="0.42"/>
      <text x="113" y="217" text-anchor="middle" fill="#E2E8F0" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">DOMAIN</text>
      <text x="113" y="236" text-anchor="middle" fill="#718096" font-family="ui-monospace, monospace" font-size="10">Use Cases</text>
    </g>
    <g class="float-a">
      <rect x="242" y="190" width="116" height="62" rx="16" fill="#0B1220" stroke="#34D399" stroke-opacity="0.42"/>
      <text x="300" y="217" text-anchor="middle" fill="#E2E8F0" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">DATA</text>
      <text x="300" y="236" text-anchor="middle" fill="#718096" font-family="ui-monospace, monospace" font-size="10">Repositories</text>
    </g>
    <g class="float-b">
      <rect x="148" y="286" width="116" height="62" rx="16" fill="#0B1220" stroke="#FB923C" stroke-opacity="0.42"/>
      <text x="206" y="313" text-anchor="middle" fill="#E2E8F0" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">PLATFORM</text>
      <text x="206" y="332" text-anchor="middle" fill="#718096" font-family="ui-monospace, monospace" font-size="10">Android · iOS</text>
    </g>

    <circle class="pulse" cx="206" cy="219" r="8" fill="#67E8F9" filter="url(#glow)"/>
    <circle cx="206" cy="219" r="4" fill="#A5F3FC"/>
    <text class="shimmer" x="206" y="382" text-anchor="middle" fill="#708095" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.4">CLEAN · SCALABLE · SHIPPED</text>
  </g>

  <path d="M72 454H641" stroke="url(#accent)" stroke-opacity="0.65"/>
  <text x="72" y="482" fill="#66758A" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.6">REAL-TIME SYSTEMS  ·  OFFLINE-FIRST  ·  ON-DEVICE ML  ·  CI/CD</text>
</svg>
